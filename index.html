<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Becker_Vault | Digitaler Kalender</title>
    <style>
        :root {
            --becker-gold: #d4af37;
            --becker-dark: #2c3e50;
            --bg-gray: #f4f7f6;
            --event-legal: #fff3cd;
            --event-work: #d1ecf1;
            --event-health: #f8d7da;
            --event-private: #e2e3e5;
            --event-finance: #e2f0d9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-gray);
            margin: 0;
            padding: 20px;
        }

        .calendar-container {
            max-width: 1250px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        header {
            background: var(--becker-dark);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: nowrap; /* Verhindert das unschöne Umbrechen in die nächste Zeile */
            gap: 20px;
        }

        .header-left {
            flex-shrink: 0;
        }

        /* Starre Anordnung für die rechte Seite (Navigation, QR, Suche) auf einer Linie */
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--becker-gold);
        }

        select.month-select {
            background: #34495e;
            color: white;
            border: 1px solid rgba(255,255,255,0.4);
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Fixierte Box für den QR-Code, damit nichts flackert oder springt */
        .qr-code-box {
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            padding: 4px;
            border-radius: 4px;
            width: 40px;
            height: 40px;
            box-sizing: border-box;
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .qr-code-box img {
            display: block;
            width: 32px;
            height: 32px;
            border: none;
        }

        .search-box {
            padding: 8px 15px;
            border-radius: 20px;
            border: none;
            width: 220px;
            box-sizing: border-box;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background-color: #ddd;
            gap: 1px;
            border-bottom: 1px solid #ddd;
        }

        .weekday {
            background: #eee;
            padding: 12px 10px;
            text-align: center;
            font-weight: bold;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #555;
        }

        .day {
            background: white;
            min-height: 165px;
            padding: 6px;
            position: relative;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .day-number {
            font-size: 0.85rem;
            color: #999;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .day.current-month .day-number {
            color: #333;
        }

        .events-container {
            flex: 1;
            overflow-y: auto;
            max-height: 135px;
        }

        .event {
            font-size: 0.68rem;
            padding: 3px 5px;
            margin-bottom: 3px;
            border-radius: 3px;
            border-left: 3px solid transparent;
            line-height: 1.2;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }

        /* Kategorien */
        .legal { background: var(--event-legal); border-left-color: var(--becker-gold); color: #856404; }
        .work { background: var(--event-work); border-left-color: #17a2b8; color: #0c5460; }
        .health { background: var(--event-health); border-left-color: #dc3545; color: #721c24; }
        .private { background: var(--event-private); border-left-color: #6c757d; color: #383d41; }
        .finance { background: var(--event-finance); border-left-color: #28a745; color: #1e4620; }

        .canceled {
            text-decoration: line-through;
            opacity: 0.5;
            background: #f8f9fa !important;
            border-left-color: #adb5bd !important;
            color: #6c757d !important;
        }

        .note-preview {
            display: block;
            font-size: 0.6rem;
            font-style: italic;
            margin-top: 1px;
            color: #666;
            border-top: 1px dashed rgba(0,0,0,0.04);
            padding-top: 1px;
        }

        .day.other-month { background: #fafafa; }
        .day.highlight-birthday { background: #fff9e6; border: 2px solid var(--becker-gold); }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 0.7rem;
            color: #888;
            background: #f9f9f9;
        }
    </style>
</head>

                <select id="month-select" class="month-select" onchange="jumpToMonth()">

                <button class="nav-btn" onclick="changeMonth(1)">&gt;</button>

                </a>
            </div>

            <input type="text" id="search" class="search-box" placeholder="Archiv durchsuchen..." onkeyup="searchCalendar()">
        </div>
    </header>

    <div class="calendar-grid" id="calendar-grid">
        <!-- Inhalte werden dynamisch injiziert -->
    </div>
</div>

    const monthNames = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
    
    let currentYear = 2026;
    let currentMonth = 4; // Standardmäßig Mai 2026 anzeigen

    const select = document.getElementById('month-select');
    for (let year = 2025; year <= 2026; year++) {
        for (let m = 0; m < 12; m++) {
            if (year === 2026 && m > 6) break; // Nur bis Juli 2026
            let opt = document.createElement('option');
            opt.value = `${year}-${m}`;
            opt.innerText = `${monthNames[m]} ${year}`;
            select.appendChild(opt);
        }
    }

    function updateSelectValue() {
        select.value = `${currentYear}-${currentMonth}`;
    }

    function changeMonth(dir) {
        currentMonth += dir;
        if (currentMonth > 11) {
            if (currentYear < 2026) {
                currentYear++;
                currentMonth = 0;
            } else {
                currentMonth = 11;
            }
        } else if (currentMonth < 0) {
            if (currentYear > 2025) {
                currentYear--;
                currentMonth = 11;
            } else {
                currentMonth = 0;
            }
        }
        if (currentYear === 2026 && currentMonth > 6) {
            currentMonth = 6;
        }
        updateSelectValue();
        renderCalendar();
    }

    function jumpToMonth() {
        let val = select.value.split('-');
        currentYear = parseInt(val[0]);
        currentMonth = parseInt(val[1]);
        renderCalendar();
    }

    function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        const title = document.getElementById('calendar-title');
        
        title.innerText = `${monthNames[currentMonth].toUpperCase()} ${currentYear}`;
        grid.innerHTML = '';

        const daysOfWeek = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
        daysOfWeek.forEach(d => {
            let div = document.createElement('div');
            div.className = 'weekday';
            div.innerText = d;
            grid.appendChild(div);
        });

        let firstDay = new Date(currentYear, currentMonth, 1);
        let startDayOfWeek = firstDay.getDay() - 1; 
        if (startDayOfWeek < 0) startDayOfWeek = 6;

        let daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        let prevDaysInMonth = new Date(currentYear, currentMonth, 0).getDate();

        // Vormonat auffüllen
        for (let i = startDayOfWeek - 1; i >= 0; i--) {
            let num = prevDaysInMonth - i;
            let div = document.createElement('div');
            div.className = 'day other-month';
            div.innerHTML = `<span class="day-number">${num}</span><div class="events-container"></div>`;
            grid.appendChild(div);
        }

        // Aktueller Monat
        for (let d = 1; d <= daysInMonth; d++) {
            let div = document.createElement('div');
            div.className = 'day current-month';
            
            let dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            
            if (dateStr === "2026-05-18") {
                div.className += " highlight-birthday";
            }

            let eventsHtml = '';
            if (eventData[dateStr]) {
                eventData[dateStr].forEach(ev => {
                    eventsHtml += `
                        <div class="event ${ev.cat}">
                            <strong>${ev.title}</strong>
                            ${ev.note ? `<span class="note-preview">${ev.note}</span>` : ''}
                        </div>
                    `;
                });
            }

            div.innerHTML = `<span class="day-number">${d}</span><div class="events-container">${eventsHtml}</div>`;
            grid.appendChild(div);
        }

        // Folgemonat auffüllen
        let totalCells = startDayOfWeek + daysInMonth;
        let nextMonthDays = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
        if (totalCells + nextMonthDays < 42) nextMonthDays += 7;

        for (let i = 1; i <= nextMonthDays; i++) {
            let div = document.createElement('div');
            div.className = 'day other-month';
            div.innerHTML = `<span class="day-number">${i}</span><div class="events-container"></div>`;
            grid.appendChild(div);
        }
    }

    function searchCalendar() {
        let input = document.getElementById('search').value.toLowerCase();
        let events = document.getElementsByClassName('event');
        
        for (let i = 0; i < events.length; i++) {
            if (events[i].innerText.toLowerCase().includes(input)) {
                events[i].style.opacity = "1";
                events[i].style.outline = "2px solid #d4af37";
            } else {
                events[i].style.opacity = "0.15";
                events[i].style.outline = "none";
            }
            if (input === "") {
                events[i].style.opacity = "1";
                events[i].style.outline = "none";
            }
        }
    }

    // Start-Initialisierung
    updateSelectValue();
    renderCalendar();
</script>
